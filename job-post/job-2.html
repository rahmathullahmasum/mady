    <meta charset="utf-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <section class="mady-template-layout2"> 
        <div class="mady-header">
        <div class="mady-progress-wrap">
            <div class="mady-logo-holder">
                <a href="login-1.html" class="mady-logo"><img src="img/logo-2.svg" alt="Logo"></a>
            </div>
            <div class="mady-progress-inner-wrap">
                <div class="progress">
                    <div class="progress-vertical-bar progress-bar progress-bar-solid progress-bar-animated" role="progressbar" aria-valuemin="0" aria-valuemax="100">
                    </div>
                </div>
                <div class="step-count"></div>
            </div>
            <div class="mady-socials">
                <ul>
                    <li class="mady-facebook">
                        <a href="#" title="Facebook"><i class="fab fa-facebook-f"></i></a>
                    </li>
                    <li class="mady-twitter">
                        <a href="#" title="twitter"><i class="fab fa-twitter"></i></a>
                    </li>
                    <li class="mady-google">
                        <a href="#" title="google"><i class="fab fa-google-plus-g"></i></a>
                    </li>
                    <li class="mady-linkedin">
                        <a href="#" title="linkedin"><i class="fab fa-linkedin-in"></i></a>
                    </li>
                    <li class="mady-pinterest">
                        <a href="#" title="pinterest"><i class="fab fa-pinterest-p"></i></a>
                    </li>
                </ul>
            </div>
        </div>
        </div>
        <div class="mady-form-wrap">
            <div class="mady-main-form">
                <div>
                   
                    <form action="job-1-success.html" method="GET">
                        <div class="mady-form-step">
                            <h2 class="mady-page-title">Personal Information</h2>
                            <div class="form-group">
                                <div class="position-relative">
                                    <input id="name" type="text" class="form-control" name="name" placeholder="Name">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="position-relative">
                                    <input id="email" type="email" class="form-control" name="email" placeholder="Email">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="position-relative">
                                    <input id="phone" type="text" class="form-control" name="phone" placeholder="Phone">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="radio-wrap">
                                    <label for="email" class="mady-input-label">Select Gender</label>
                                    <div class="row">
                                        <div class="col-sm-6">
                                        <div class="radio-box">
                                            <input class="form-check-input" type="radio" name="radio-gender" id="radio-male">
                                            <label class="form-check-label" for="radio-male">Male</label>
                                        </div>
                                        </div>
                                        <div class="col-sm-6">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-gender" id="radio-female">
                                                <label class="form-check-label" for="radio-female">Female</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="d-flex align-items-center gap-2 mt-5">
                                    <input type="button" name="next" class="next mady-btn-fill" value="Next Step">
                                </div>
                            </div>
                        </div>                               
                        <div class="mady-form-step">
                            <h2 class="mady-page-title">Select Job Position</h2>
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box hide-radio-box">
                                            <input id="radio-position1" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position1">Graphic Designer</label>
                                            <div class="icon-holder">
                                                <i class="fa-solid fa-pen-nib"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box hide-radio-box">
                                            <input id="radio-position2" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position2">UI/UX Designer</label>
                                            <div class="icon-holder">
                                                <i class="fa-solid fa-crop-simple"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box hide-radio-box">
                                            <input id="radio-position3" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position3">Frontend Developer</label>
                                            <div class="icon-holder">
                                                <i class="fa-brands fa-html5"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box hide-radio-box">
                                            <input id="radio-position4" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position4">WordPress Developer</label>
                                            <div class="icon-holder">
                                                <i class="fa-brands fa-wordpress"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box hide-radio-box">
                                            <input id="radio-position5" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position5">Support Engineer</label>
                                            <div class="icon-holder">
                                                <i class="fa-solid fa-headset"></i>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <div class="d-flex align-items-center gap-4 mt-5">
                                            <input type="button" name="previous" class="previous mady-btn-fill" value="Previous Step">
                                            <input type="button" name="next" class="next mady-btn-fill" value="Next Step">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mady-form-step">
                            <h2 class="mady-page-title">Work Experiance</h2>                            
                            <div class="row">
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box">
                                            <input id="radio-position6" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position6">Graphic Designer</label>
                                        
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box">
                                            <input id="radio-position7" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position7">UI/UX Designer</label>
                                        
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box">
                                            <input id="radio-position8" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position8">Frontend Developer</label>
                                        
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box">
                                            <input id="radio-position9" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position9">WordPress Developer</label>
                                        
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6">
                                    <div class="form-group">
                                        <div class="radio-box">
                                            <input id="radio-position10" class="form-check-input" name="radio-position" type="radio">
                                            <label class="form-check-label" for="radio-position10">Support Engineer</label>
                                        
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-12">
                                    <div class="form-group">
                                        <div class="d-flex align-items-center gap-4 mt-5">
                                            <input type="button" name="previous" class="previous mady-btn-fill" value="Previous Step">
                                            <input type="button" name="next" class="next mady-btn-fill" value="Next Step">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mady-form-step">
                            <h2 class="mady-page-title">Salary Range</h2>
                            <div class="form-group">
                                <div class="radio-wrap">
                                    <label for="email" class="mady-input-label">Work Availability</label>
                                    <div class="row">
                                        <div class="col-lg-4">
                                        <div class="radio-box">
                                            <input class="form-check-input" type="radio" name="radio-work" id="radio-full">
                                            <label class="form-check-label" for="radio-full">Full Time</label>
                                        </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-work" id="radio-part">
                                                <label class="form-check-label" for="radio-part">Part Time</label>
                                            </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-work" id="radio-freelence">
                                                <label class="form-check-label" for="radio-freelence">Freelance / Contract</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="radio-wrap">
                                    <label for="email" class="mady-input-label">Expected Salary Range </label>
                                    <div class="row">
                                        <div class="col-lg-4">
                                        <div class="radio-box">
                                            <input class="form-check-input" type="radio" name="radio-salary" id="radio-salary1">
                                            <label class="form-check-label" for="radio-salary1">(500 - 750) USD</label>
                                        </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-salary" id="radio-salary2">
                                                <label class="form-check-label" for="radio-salary2">(750 - 1000) USD</label>
                                            </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-salary" id="radio-salary3">
                                                <label class="form-check-label" for="radio-salary3">(1000 - 1500) USD</label>
                                            </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-salary" id="radio-salary4">
                                                <label class="form-check-label" for="radio-salary4">(2000- 3000) USD</label>
                                            </div>
                                        </div>
                                        <div class="col-lg-4">
                                            <div class="radio-box">
                                                <input class="form-check-input" type="radio" name="radio-salary" id="radio-salary5">
                                                <label class="form-check-label" for="radio-salary5">Above 3000 USD</label>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="d-flex align-items-center gap-4 mt-5">
                                    <input type="button" name="previous" class="previous mady-btn-fill" value="Previous Step">
                                    <input type="button" name="next" class="next mady-btn-fill" value="Next Step">
                                </div>
                            </div>
                        </div>
                        <div class="mady-form-step">
                            <h2 class="mady-page-title">Cover Letter And Resume</h2>
                            <div class="form-group">
                                <textarea class="form-control" name="cover-etter" id="cover-etter" cols="40" rows="6" placeholder="Cover letter"></textarea>
                            </div>
                            <div class="form-group">
                                <input type="file" class="form-control">
                                <!-- <label class="custom-file-label" for="validatedCustomFile"><span class="file-return">No file choosen</span></label> -->
                            </div>
                            <div class="form-group">
                                <div class="checkbox">
                                    <input id="checkbox1" type="checkbox">
                                    <label for="checkbox1">I Accept The <a href="#">Term Of Conditions</a> And <a href="#">Privacy Policy</a></label>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="d-flex align-items-center gap-4">
                                    <input type="button" name="previous" class="previous mady-btn-fill" value="Previous Step">
                                    <input type="submit" name="next" class="mady-btn-fill" value="Submit">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>       
    </section>
