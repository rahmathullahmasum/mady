<!doctype html>
<html class="no-js" lang="">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Mady | Login and Register Form Html Templates</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.png">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="css/vendor/bootstrap.min.css">
    <!-- Fontawesome CSS -->
    <link rel="stylesheet" href="css/vendor/css/all.min.css">
    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

<body>
    <!--[if lt IE 8]>
        <p class="browserupgrade">You are using an <strong>outdated</strong> browser. Please <a href="http://browsehappy.com/">upgrade your browser</a> to improve your experience.</p>
    <![endif]-->
    <section class="mady-template-layout4"> 
        <div class="mady-bg">
            <img src="img/figure/bg4-1.jpg" alt="Bg">
        </div>
        <div class="mady-header">
            <a href="login-1.html" class="mady-logo"><img src="img/logo-4.svg" alt="Logo"></a>
            <div class="mady-footer">
                <ul class="mady-socials">
                    <li>
                        <a href="#" class="mady-facebook" title="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    </li>
                    <li>
                        <a href="#" class="mady-twitter" title="twitter"><i class="fa-brands fa-x-twitter"></i></a>
                    </li>
                    <li>
                        <a href="#" class="mady-linkedin" title="linkedin"><i class="fa-brands fa-linkedin-in"></i></a>
                    </li>
                    <li>
                        <a href="#" class="mady-instagram" title="instagram"><i class="fa-brands fa-instagram"></i></a>
                    </li>
                </ul>             
            </div>
        </div>
        <div class="text-center">
            <h1 class="mady-main-title">Get in Touch</h1>
            <p class="mady-description">We are here to answer any question you may have.</p>
        </div>
        <div class="mady-contact-info">
            <div class="row g-4">
                <div class="col-lg-4">
                <div class="info-box">
                    <div class="icon-holder">
                        <i class="fa-light fa-envelope"></i>
                    </div>
                    <div class="info-holder">
                        <span class="mady-info-label">Call Us</span>                
                        <span class="mady-info-text">+34 000 0000</span>
                    </div>
                </div>         
                </div>         
                <div class="col-lg-4">
                <div class="info-box">
                    <div class="icon-holder">
                        <i class="fa-light fa-envelope"></i>
                    </div>
                    <div class="info-holder">
                        <span class="mady-info-label">Email Address</span>                  
                        <span class="mady-info-text">hello@uweb.com</span>
                    </div>
                </div>         
                </div>         
                <div class="col-lg-4">
                <div class="info-box">
                    <div class="icon-holder">
                        <i class="fa-light fa-envelope"></i>
                    </div>
                    <div class="info-holder">
                        <span class="mady-info-label">Address</span>                
                        <span class="mady-info-text">54/5 alaska street dunasia QC (USA) H8R 1A1</span>
                    </div>
                </div>         
                </div>         
            </div>
        </div>
        <div class="mady-main-body">
            <h2 class="mady-title">Send A Message</h2>
            <div class="mady-form-area">
                <form method="POST">
                    <div class="row">
                        <div class="col-lg-6 form-group">
                            <div class="position-relative">
                                <input type="text" class="form-control" name="name" placeholder="Your Name*" required="required">
                            </div>
                        </div>
                        <div class="col-lg-6 form-group">
                            <div class="position-relative">
                                <input type="email" class="form-control" name="email" placeholder="Email*" required="required">
                            </div>
                        </div>
                        <div class="col-lg-12 form-group">
                            <div class="position-relative">
                                <input type="text" class="form-control" name="subject" placeholder="Subject*" required="required">
                            </div>
                        </div>
                        <div class="col-lg-12 form-group">
                            <div class="position-relative">
                                <textarea type="text" class="form-control" name="message" rows="7" placeholder="Message*" required="required"></textarea>
                            </div>
                        </div>
                        <div class="col-lg-12 form-group">
                            <button type="submit" class="mady-btn-fill">Send Messages</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
       
        
    </section>
    <!-- jquery-->
    <script src="js/vendor/jquery.min.js"></script>
    <!-- Bootstrap js -->
    <script src="js/vendor/bootstrap.min.js"></script>
    <!-- Imagesloaded js -->
    <script src="js/vendor/imagesloaded.pkgd.min.js"></script>
    <!-- Validator js -->
    <script src="js/vendor/validator.min.js"></script>
    <!-- Custom Js -->
    <script src="js/app.js"></script>

</body>

</html>
